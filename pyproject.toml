[project]
name = "mymaid"
version = "0.1.0"
description = "MyMaid — a Claude Agent SDK service with FastAPI, DynamoDB/MongoDB/S3, and document loaders"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "claude-agent-sdk>=0.1.0",
    "boto3>=1.34",
    "motor>=3.5",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "langchain-community>=0.3",
    "langchain-core>=0.3",
    "pypdf>=4.2",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
